name: Android

# master: build, test and publish an installable dev APK as a workflow artifact.
# Tags v*: same checks, then a GitHub release (source only for now; see "Attach APK" below).
# Pull requests: build and test only.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # versionCode = commit count

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.0" "build-tools;37.0.0" \
            "ndk;29.0.14206865" "cmake;3.22.1" > /dev/null

      - uses: gradle/actions/setup-gradle@v6

      - name: Fetch RadioMaster SDK
        run: scripts/fetch-sdk.sh

      - name: Build and test
        run: >
          ./gradlew assembleDebug testDebugUnitTest :core:model:test :core:engine:test
          -Popenax12.release=${{ env.RELEASE }} --stacktrace

      - name: Rename APK
        id: apk
        run: |
          code=$(git rev-list --count HEAD)
          sha=$(git rev-parse --short=7 HEAD)
          out="open-ax12-${code}-${sha}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Upload dev APK
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: open-ax12-dev-apk
          path: ${{ steps.apk.outputs.file }}
          retention-days: 30

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # Attach APK: download the "open-ax12-dev-apk" artifact (actions/download-artifact)
        # and add the file to this command once APKs should be published with releases.
        run: >
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          --title "open-ax12 ${GITHUB_REF_NAME}" --notes-file docs/RELEASE_NOTES.md
